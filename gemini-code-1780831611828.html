<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Біблійні Герої: Кейси</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: white; text-align: center; padding: 20px; }
        .stats { background: #16213e; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 20px; }
        .crystal { color: #00d2d3; font-weight: bold; }
        .box-container { display: flex; justify-content: center; gap: 20px; }
        .box { background: #0f3460; padding: 20px; border-radius: 15px; cursor: pointer; border: 3px solid #e94560; transition: transform 0.2s; width: 200px; }
        .box:hover { transform: scale(1.05); }
        .box h3 { margin: 0 0 10px 0; }
        #result-screen { margin-top: 30px; font-size: 24px; font-weight: bold; padding: 20px; border-radius: 10px; display: none; }
        
        /* Кольори рідкості */
        .Рідкісний { color: #2ecc71; text-shadow: 0 0 10px #2ecc71; }
        .Сверхрідкісний { color: #3498db; text-shadow: 0 0 10px #3498db; }
        .Епічний { color: #9b59b6; text-shadow: 0 0 10px #9b59b6; }
        .Міфічний { color: #e74c3c; text-shadow: 0 0 10px #e74c3c; }
        .Легендарний { color: #f1c40f; text-shadow: 0 0 20px #f1c40f; }

        /* Проста CSS анімація "відкриття" */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .animating { animation: shake 0.5s; }
    </style>
</head>
<body>

    <h1>Біблійні Герої: Прокачка</h1>
    
    <div class="stats">
        Ваші кристали: <span class="crystal" id="crystal-count">500</span> 💎
    </div>

    <div class="box-container">
        <div class="box" onclick="openBox('standard', 30)">
            <h3>Звичайний Бокс</h3>
            <p>Ціна: 30 💎</p>
        </div>
        <div class="box" onclick="openBox('mega', 100)">
            <h3>Мега Бокс</h3>
            <p>Ціна: 100 💎</p>
        </div>
    </div>

    <div id="result-screen"></div>

    <script>
        let crystals = 500;
        const heroes = ["Неемія", "Давид", "Самсон", "Йосип"];

        // Шанси: [Рідкісний, Сверхрідкісний, Епічний, Міфічний, Легендарний]
        const chances = {
            standard: [70, 90, 98, 99.9, 100], // Кумулятивні шанси для легкого рандому
            mega: [30, 70, 90, 98, 100]
        };

        const rarities = ["Рідкісний", "Сверхрідкісний", "Епічний", "Міфічний", "Легендарний"];

        function updateUI() {
            document.getElementById('crystal-count').innerText = crystals;
        }

        function openBox(type, cost) {
            if (crystals < cost) {
                alert("Недостатньо кристалів!");
                return;
            }

            // Віднімаємо кристали
            crystals -= cost;
            updateUI();

            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'none';
            resultScreen.className = '';
            
            // Імітація анімації відкриття
            document.body.classList.add('animating');
            setTimeout(() => {
                document.body.classList.remove('animating');
                generateLoot(type);
            }, 600); // Затримка для анімації
        }

        function generateLoot(boxType) {
            const randHero = heroes[Math.floor(Math.random() * heroes.length)];
            const roll = Math.random() * 100; // Випадкове число від 0 до 100
            
            let rarityIndex = 0;
            for (let i = 0; i < chances[boxType].length; i++) {
                if (roll <= chances[boxType][i]) {
                    rarityIndex = i;
                    break;
                }
            }

            const droppedRarity = rarities[rarityIndex];
            const resultScreen = document.getElementById('result-screen');
            
            resultScreen.innerHTML = `Випав предмет для героя <b>${randHero}</b>!<br>
                                      Рідкість: <span class="${droppedRarity}">${droppedRarity}</span>`;
            resultScreen.style.display = 'block';
            
            // Якщо лега - додаємо додатковий ефект
            if(droppedRarity === "Легендарний") {
                resultScreen.innerHTML += "<br>🌟 ВАУ! ЛЕГЕНДАРКА! 🌟";
            }
        }
    </script>

</body>
</html>
